<html>
    <head>
        <meta charset="utf-8">
        <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src *;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        
		<link rel="stylesheet" type="text/css" href="css/leaflet.css">
		<link rel="stylesheet" type="text/css" href="css/all.css">
		<link rel="stylesheet" type="text/css" href="css/app.css">

        <title>G2</title>
    </head>
    <body>

	<div id="coordinates">
		<strong><p id="coordinates-text"></p></strong>
	</div>
	
	<div id="map">
	</div>

	<!-- Leyenda de SIOSE (usos del suelo) -->
	<div id="siose-legend" style="display: none;">
		<h4 style="margin: 0 0 10px 0; font-size: 14px;">Usos del Suelo</h4>
		<div class="legend-item"><span class="legend-color" style="background: #e60000;"></span>Urbano</div>
		<div class="legend-item"><span class="legend-color" style="background: #ffff00;"></span>Cultivos</div>
		<div class="legend-item"><span class="legend-color" style="background: #38a800;"></span>Bosques</div>
		<div class="legend-item"><span class="legend-color" style="background: #a8e600;"></span>Pastizales</div>
		<div class="legend-item"><span class="legend-color" style="background: #ffaa00;"></span>Matorral</div>
		<div class="legend-item"><span class="legend-color" style="background: #73b2ff;"></span>Zonas húmedas</div>
		<div class="legend-item"><span class="legend-color" style="background: #0070ff;"></span>Agua</div>
		<div class="legend-item"><span class="legend-color" style="background: #cccccc;"></span>Otros</div>
	</div>

	<div id="menu">
        <i class="fa-solid fa-location-dot"></i>
		<i class="fa-solid fa-square-plus"></i>
		<i class="fa-solid fa-square-minus"></i>
		<i class="fa-solid fa-layer-group"></i>
		<!-- Botón: visualizar todos los puntos -->
		<i class="fa-solid fa-map-pin"></i>
		
		<p id="separator" style="line-height: 50%;"> <br> </p>
		
		<i class="fa-solid fa-floppy-disk"></i>
		
		<!-- Selector de capas base -->
        <select id="basemap-select" style="display:none;">
            <option value="osm">OSM</option>
            <option value="pnoa">PNOA</option>
            <option value="siose">SIOSE</option>
        </select>
	</div>
	
	<div id="point-id" style="display: none;">
		<input type="text" id="point-id-text">
	</div>
    
    <!-- Modal para seleccionar puntos a eliminar -->
    <div id="delete-points-modal" style="display: none;">
        <div class="modal-content">
            <h3 style="margin: 0 0 15px 0;">Eliminar Puntos</h3>
            <div id="points-list" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;">
                <!-- Lista de puntos se generará dinámicamente -->
            </div>
            <div style="display: flex; justify-content: space-between; gap: 10px;">
                <button id="delete-selected-btn" style="flex: 1; padding: 10px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">Eliminar seleccionados</button>
                <button id="delete-all-btn" style="flex: 1; padding: 10px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer;">Eliminar todos</button>
                <button id="cancel-delete-btn" style="flex: 1; padding: 10px; background: #9e9e9e; color: white; border: none; border-radius: 5px; cursor: pointer;">Cancelar</button>
            </div>
        </div>
    </div>
    
    <!-- Formulario de atributos para cada punto -->
    <div id="attributes-form" style="display: none; position: absolute; left: 10px; right: 10px; bottom: 10px; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 1000;">
        <h3 style="margin:0 0 8px 0;">Atributos del punto</h3>
        <div style="display: flex; flex-direction: column; gap:6px;">
            <label>Especie:<input id="attr-especie" type="text" style="width:100%;"></label>
            <label>Altura (m):<input id="attr-altura" type="number" step="0.01" style="width:100%;"></label>
            <label>DAP (m):<input id="attr-dap" type="number" step="0.01" style="width:100%;"></label>
            <label>Estado fito:
                <select id="attr-estado" style="width:100%;">
                    <option value="bueno">bueno</option>
                    <option value="regular">regular</option>
                    <option value="malo">malo</option>
                </select>
            </label>
            <label>Cobertura:<input id="attr-cobertura" type="text" style="width:100%;"></label>
            <label>Observaciones:<textarea id="attr-observaciones" rows="3" style="width:100%;"></textarea></label>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
            <button id="attr-cancel" style="padding:6px 10px;">Cancelar</button>
            <button id="attr-save" style="padding:6px 10px;">Guardar</button>
        </div>
    </div>
	
	<div>
		<p id="toast" style="display: none;"></p>
	</div>

    <script src="cordova.js"></script>
	
	<script language="javascript" type="text/javascript" src="js/leaflet.js"></script>
	<script language="javascript" type="text/javascript" src="js/proj4.js"></script>
	<script language="javascript" type="text/javascript" src="js/app.js"></script>
        
    </body>
</html>
