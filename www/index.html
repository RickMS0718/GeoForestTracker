<html>
    <head>
        <meta charset="utf-8">
        <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src *;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        
		<link rel="stylesheet" type="text/css" href="css/leaflet.css">
		<link rel="stylesheet" type="text/css" href="css/all.css">
		<link rel="stylesheet" type="text/css" href="css/app.css">

        <title>G2</title>
    </head>
    <body>

	<div id="coordinates">
		<strong><p id="coordinates-text"></p></strong>
	</div>
	
	<div id="map">
	</div>

	<div id="menu">
        <i class="fa-solid fa-location-dot"></i>
		<i class="fa-solid fa-square-plus"></i>
		<i class="fa-solid fa-square-minus"></i>
		<i class="fa-solid fa-layer-group"></i>
        <!-- Nuevo botón: abrir formulario de atributos -->
        <i class="fa-solid fa-file-pen"></i>
		
		<p id="separator" style="line-height: 50%;"> <br> </p>
		
		<i class="fa-solid fa-floppy-disk"></i>
	</div>
	
	<div id="point-id" style="display: none;">
		<input type="text" id="point-id-text">
	</div>
    
    <!-- Formulario de atributos para cada punto -->
    <div id="attributes-form" style="display: none; position: absolute; left: 10px; right: 10px; bottom: 10px; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 1000;">
        <h3 style="margin:0 0 8px 0;">Atributos del punto</h3>
        <div style="display: flex; flex-direction: column; gap:6px;">
            <label>Especie:<input id="attr-especie" type="text" style="width:100%;"></label>
            <label>Altura (m):<input id="attr-altura" type="number" step="0.01" style="width:100%;"></label>
            <label>Estado fito:<input id="attr-estado" type="text" style="width:100%;"></label>
            <label>Cobertura:<input id="attr-cobertura" type="text" style="width:100%;"></label>
            <label>Observaciones:<textarea id="attr-observaciones" rows="3" style="width:100%;"></textarea></label>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
            <button id="attr-cancel" style="padding:6px 10px;">Cancelar</button>
            <button id="attr-save" style="padding:6px 10px;">Guardar</button>
        </div>
    </div>
	
	<div>
		<p id="toast" style="display: none;"></p>
	</div>

    <script src="cordova.js"></script>
	
	<script language="javascript" type="text/javascript" src="js/leaflet.js"></script>
	<script language="javascript" type="text/javascript" src="js/proj4.js"></script>
	<script language="javascript" type="text/javascript" src="js/app.js"></script>
        
    </body>
</html>
